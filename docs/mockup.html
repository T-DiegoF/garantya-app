.tab{font-size:12px;font-weight:700;padding:5px 13px;border-radius:7px;border:none;background:transparent;color:#78716C;cursor:pointer;white-space:nowrap}
.tab.active{background:white;color:#1C1917;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.flow-sec{margin-bottom:52px}
.flow-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:#A8A29E;margin-bottom:4px}

.flow-row{display:flex;align-items:flex-start;gap:0;padding-bottom:4px}

.bvcol{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:32px}
.bvline{width:2px;background:#C4B5A5;flex:1;min-height:24px}

function render() {
  const t = T[currentLang];
  if (currentView === 'mobile') {
    document.getElementById('mobile-sec').innerHTML = renderMobile(t);
  } else {
    document.getElementById('desktop-sec').innerHTML = renderDesktop(t);
  }
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('#lang-tabs .tab').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
  render();
}

function setView(view) {
  currentView = view;
  document.getElementById('mobile-sec').style.display  = view === 'mobile'  ? '' : 'none';
  document.getElementById('desktop-sec').style.display = view === 'desktop' ? '' : 'none';
  document.querySelectorAll('#view-tabs .tab').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(view === 'mobile' ? 'Mobile' : 'Desktop'));
  });
  render();
}

// Init
